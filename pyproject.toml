[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-detector"
version = "0.1.0"
description = "Hybrid deep learning and forensic frequency-domain detector for real vs. AI-generated images."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.scripts]
ai-detect = "ai_image_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
